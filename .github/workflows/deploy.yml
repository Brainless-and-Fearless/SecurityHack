name: Deploy SecurityHack

on:
  workflow_dispatch:

concurrency:
  group: securityhack-production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production
    runs-on: [self-hosted, Linux, X64, production-securityhack]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Sync application files
        shell: bash
        run: |
          set -euo pipefail

          test -d /var/www/html
          test -w /var/www/html
          command -v rsync >/dev/null

          rsync -a \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude=".env" \
            --exclude="backend/.env" \
            --exclude="backend/venv/" \
            --exclude="backend/keyhack.db" \
            --exclude="uploads/" \
            --exclude="media/" \
            --exclude="data/" \
            ./ /var/www/html/

      - name: Create virtual environment and install dependencies
        shell: bash
        run: |
          set -euo pipefail

          cd /var/www/html

          if [ ! -x backend/venv/bin/python ]; then
            python3 -m venv backend/venv
          fi

          backend/venv/bin/python -m pip install --upgrade pip
          backend/venv/bin/pip install -r backend/requirements.txt

      - name: Restart FastAPI
        shell: bash
        run: |
          set -euo pipefail

          sudo systemctl restart fastapi.service
          sudo systemctl is-active --quiet fastapi.service
